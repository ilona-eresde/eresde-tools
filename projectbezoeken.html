<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#234e52" />
  <title>Projectbezoeken | Eresde Manager</title>
  <style>
    :root{
      --bg:#f4f7f7;--card:#fff;--ink:#1f2933;--muted:#64748b;--line:#dce5e5;
      --brand:#234e52;--brand2:#2f6f73;--soft:#e8f2f2;--ok:#217a48;--warn:#9a6700;
      --danger:#b42318;--info:#175cd3;--shadow:0 10px 30px rgba(28,62,65,.10)
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select,textarea{font:inherit}.app{max-width:1200px;margin:auto;min-height:100vh}
    header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:18px 18px 12px;box-shadow:0 5px 18px rgba(20,55,58,.22)}
    .headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:1.35rem;font-weight:800}.subtitle{opacity:.88;font-size:.9rem;margin-top:2px}
    .sync{font-size:.78rem;background:rgba(255,255,255,.16);padding:7px 10px;border-radius:999px;white-space:nowrap}.sync.ok{background:#d1fadf;color:#065f46}.sync.warn{background:#fef0c7;color:#7a2e0e}.sync.err{background:#fee4e2;color:#912018}
    nav{display:flex;gap:7px;overflow-x:auto;padding:10px 0 0}.tab{border:0;background:rgba(255,255,255,.13);color:#fff;padding:9px 12px;border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap}.tab.active{background:var(--bg);color:var(--brand);font-weight:800}
    main{padding:18px}.view{display:none}.view.active{display:block}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:var(--card);padding:16px;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
    .stat .n{font-size:1.8rem;font-weight:900;margin-top:6px}.stat .l{font-size:.86rem;color:var(--muted)}
    .section{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.section h2{font-size:1rem;margin:0;padding:15px 17px;border-bottom:1px solid var(--line)}.sectionbody{padding:15px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}.field label{font-size:.8rem;font-weight:700;color:#475569}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:11px 12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,111,115,.15)}textarea{min-height:100px;resize:vertical}
    .btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:var(--brand);color:#fff}.btn.secondary{background:var(--soft);color:var(--brand)}.btn.success{background:#dcfae6;color:#116b3a}.btn.danger{background:#fee4e2;color:#9b1c1c}.btn.ghost{background:#f1f5f9;color:#334155}.btn:disabled{opacity:.5;cursor:not-allowed}
    .list{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;background:#fff}.item h3{margin:0 0 5px;font-size:1rem}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:.82rem}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:#eef2f6;color:#475569;font-size:.75rem;font-weight:800}.pill.high{background:#fff1cc;color:#8a5300}.pill.urgent{background:#fee4e2;color:#9b1c1c}.pill.done{background:#dcfae6;color:#116b3a}.pill.cancelled{background:#eceff3;color:#667085}.pill.late{background:#fee4e2;color:#9b1c1c}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;align-content:flex-start}
    .empty{text-align:center;padding:28px 15px;color:var(--muted)}.todayTitle{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:.8rem;color:var(--muted)}
    .formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.span2{grid-column:span 2}.notice{padding:12px;border-radius:12px;background:#eff8ff;color:#1849a9;font-size:.85rem;border:1px solid #b2ddff}.hide{display:none!important}
    .modalback{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}.modalback.open{display:flex}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.x{border:0;background:#f1f5f9;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer}
    .footerline{margin-top:18px;text-align:center;color:var(--muted);font-size:.75rem}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.item{grid-template-columns:1fr}.actions{justify-content:flex-start}}
    @media(max-width:420px){main{padding:12px}.grid{gap:8px}.stat{padding:13px}.stat .n{font-size:1.45rem}.title{font-size:1.15rem}.sync{max-width:125px;overflow:hidden;text-overflow:ellipsis}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="headrow">
      <div><div class="title">📅 Projectbezoeken</div><div class="subtitle">Planning, controles en overlegmomenten</div></div>
      <div id="syncStatus" class="sync warn">Alleen lokaal</div>
    </div>
    <nav>
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="planning">Planning</button>
      <button class="tab" data-view="new">Nieuw bezoek</button>
      <button class="tab" data-view="history">Historie</button>
    </nav>
  </header>

  <main>
    <section id="dashboard" class="view active">
      <div class="grid">
        <div class="stat"><div class="l">Vandaag</div><div class="n" id="statToday">0</div></div>
        <div class="stat"><div class="l">Deze week</div><div class="n" id="statWeek">0</div></div>
        <div class="stat"><div class="l">Achterstallig</div><div class="n" id="statLate">0</div></div>
        <div class="stat"><div class="l">Uitgevoerd</div><div class="n" id="statDone">0</div></div>
      </div>
      <div class="section">
        <h2 class="todayTitle"><span>Eerstvolgende bezoeken</span><button class="btn primary" onclick="showView('new')">+ Nieuw</button></h2>
        <div class="sectionbody"><div id="upcomingList" class="list"></div></div>
      </div>
    </section>

    <section id="planning" class="view">
      <div class="section" style="margin-top:0">
        <h2>Filters</h2>
        <div class="sectionbody toolbar">
          <div class="field"><label>Zoeken</label><input id="filterSearch" placeholder="Project of opmerking"></div>
          <div class="field"><label>Type</label><select id="filterType"><option value="">Alle typen</option></select></div>
          <div class="field"><label>Status</label><select id="filterStatus"><option value="">Alle statussen</option><option>Gepland</option><option>Uitgevoerd</option><option>Vervallen</option></select></div>
          <div class="field"><label>Controleur</label><select id="filterInspector"><option value="">Alle controleurs</option></select></div>
          <button class="btn ghost" id="clearFilters">Wissen</button>
        </div>
      </div>
      <div class="section"><h2>Alle bezoeken</h2><div class="sectionbody"><div id="planningList" class="list"></div></div></div>
    </section>

    <section id="new" class="view">
      <div class="section" style="margin-top:0"><h2 id="formTitle">Nieuw projectbezoek</h2>
        <div class="sectionbody">
          <div id="configNotice" class="notice hide"></div>
          <form id="visitForm" class="formgrid" autocomplete="off">
            <input type="hidden" id="visitId">
            <div class="field span2"><label>Project *</label><select id="project" required><option value="">Kies een project</option></select></div>
            <div class="field"><label>Controleur *</label><select id="inspector" required><option value="">Kies een controleur</option></select></div>
            <div class="field"><label>Type *</label><select id="type" required></select></div>
            <div id="otherTypeWrap" class="field span2 hide"><label>Omschrijving overig *</label><input id="otherType" placeholder="Bijvoorbeeld werkoverleg klant"></div>
            <div class="field"><label>Datum *</label><input id="date" type="date" required></div>
            <div class="field"><label>Tijd (optioneel)</label><input id="time" type="time"></div>
            <div class="field"><label>Prioriteit</label><select id="priority"><option>Normaal</option><option>Hoog</option><option>Spoed</option></select></div>
            <div class="field"><label>Status</label><select id="status"><option>Gepland</option><option>Uitgevoerd</option><option>Vervallen</option></select></div>
            <div class="field span2"><label>Opmerking</label><textarea id="notes" placeholder="Aandachtspunten, aanleiding of voorbereiding"></textarea></div>
            <div class="span2" style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap">
              <button type="button" class="btn ghost" id="cancelEdit">Annuleren</button>
              <button type="submit" class="btn primary">Opslaan</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <section id="history" class="view">
      <div class="section" style="margin-top:0"><h2>Historie per project</h2>
        <div class="sectionbody">
          <div class="field" style="max-width:480px;margin-bottom:14px"><label>Project</label><select id="historyProject"><option value="">Kies een project</option></select></div>
          <div id="historyList" class="list"></div>
        </div>
      </div>
    </section>
  </main>
  <div class="footerline">Eresde Manager · Projectbezoeken v1</div>
</div>

<div id="detailsModal" class="modalback" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modalhead"><h3>Projectbezoek</h3><button class="x" onclick="closeModal()">×</button></div>
    <div id="modalContent" style="margin-top:14px"></div>
  </div>
</div>

<script>
const CONFIG = {
  PROJECTS_API: 'https://script.google.com/macros/s/AKfycbysDHylCUtXBOO3P2ftygHcCE22UQXO822UYPWm33AHQD-wEH_54FpDu_DBN7Nwz29n/exec',
  EMPLOYEES_API: 'https://script.google.com/macros/s/AKfycbwFp7kSF751T9ehWQUKVMwrldX90PTXDInxmC9FWSLARLUbKx5X_RaeNFHDmwnJyMje/exec',
  VISITS_API: 'https://script.google.com/macros/s/AKfycbw0sB3wYYihPrrniIXP56LH3_rRd_p1zQtrf1enEf42ykVoTi8mGCI1L5SCBfF8dRVZdA/exec',
  CONTROL_PAGE: 'schoonmaakcontrole_v10_qr_drive.html',
  STORAGE_KEY: 'eresde_projectbezoeken_v1'
};
const TYPES=['DKS','Nacontrole','Kwartaaloverleg','Oplevering','Klacht','Overig'];
let visits=[], projects=[], employees=[], syncTimer=null;
const $=id=>document.getElementById(id);
const todayISO=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtDate=d=>{if(!d)return '—';const [y,m,day]=d.split('-');return `${day}-${m}-${y}`};
const uid=()=>`visit_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;

function normalizeArray(data, keys=[]){
  if(Array.isArray(data)) return data;
  for(const k of keys) if(Array.isArray(data?.[k])) return data[k];
  if(Array.isArray(data?.data)) return data.data;
  return [];
}
function projectName(p){return p.name||p.projectnaam||p.projectName||p.naam||p.title||p.project||p.objectnaam||''}
function projectId(p){return String(p.id||p.projectId||p.project_id||p.projectnummer||p.projectNr||p.nummer||projectName(p))}
function employeeName(e){return e.name||e.naam||e.fullName||e.volledigeNaam||[e.voornaam,e.achternaam].filter(Boolean).join(' ')||''}
function employeeId(e){return String(e.id||e.employeeId||e.medewerkerId||e.personeelsnummer||employeeName(e))}

async function fetchJSON(url){
  const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();
}
async function loadReferenceData(){
  const results=await Promise.allSettled([fetchJSON(CONFIG.PROJECTS_API),fetchJSON(CONFIG.EMPLOYEES_API)]);
  if(results[0].status==='fulfilled') projects=normalizeArray(results[0].value,['projects','projecten','items']).filter(p=>projectName(p));
  if(results[1].status==='fulfilled') employees=normalizeArray(results[1].value,['employees','medewerkers','personeel','items']).filter(e=>employeeName(e));
  projects.sort((a,b)=>projectName(a).localeCompare(projectName(b),'nl'));
  employees.sort((a,b)=>employeeName(a).localeCompare(employeeName(b),'nl'));
  fillReferenceSelects();
}
function loadLocal(){try{visits=JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)||'[]');if(!Array.isArray(visits))visits=[]}catch{visits=[]}}
function saveLocal(){localStorage.setItem(CONFIG.STORAGE_KEY,JSON.stringify(visits));}
async function loadVisits(){
  loadLocal(); renderAll();
  if(!CONFIG.VISITS_API){setSync('Alleen lokaal','warn');$('configNotice').classList.remove('hide');$('configNotice').textContent='Drive-sync is nog niet gekoppeld. De gegevens worden nu veilig lokaal op dit apparaat bewaard.';return}
  try{
    setSync('Drive laden…','warn');
    const data=await fetchJSON(CONFIG.VISITS_API+'?t='+Date.now());
    const remote=normalizeArray(data,['visits','controles','projectbezoeken','items']);
    if(remote.length || data?.visits || data?.controles || data?.projectbezoeken){visits=remote;saveLocal();renderAll()}
    setSync('Drive verbonden','ok');
  }catch(e){setSync('Drive niet bereikbaar','err')}
}
function queueSync(){saveLocal();renderAll();clearTimeout(syncTimer);syncTimer=setTimeout(syncDrive,500)}
async function syncDrive(){
  if(!CONFIG.VISITS_API){setSync('Alleen lokaal','warn');return}
  try{
    setSync('Opslaan…','warn');
    await fetch(CONFIG.VISITS_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({visits,updatedAt:new Date().toISOString()})});
    setSync('Opgeslagen in Drive','ok');
  }catch(e){setSync('Lokaal opgeslagen','err')}
}
function setSync(text,cls){const el=$('syncStatus');el.textContent=text;el.className='sync '+cls}

function fillSelect(id,items,getVal,getLabel,placeholder){
  const el=$(id),cur=el.value;el.innerHTML=`<option value="">${placeholder}</option>`+items.map(x=>`<option value="${esc(getVal(x))}">${esc(getLabel(x))}</option>`).join('');el.value=cur;
}
function fillReferenceSelects(){
  fillSelect('project',projects,projectId,projectName,'Kies een project');
  fillSelect('historyProject',projects,projectId,projectName,'Kies een project');
  fillSelect('inspector',employees,employeeId,employeeName,'Kies een controleur');
  fillSelect('filterInspector',employees,employeeId,employeeName,'Alle controleurs');
  if(!projects.length){$('project').innerHTML='<option value="">Geen projecten geladen</option>'}
  if(!employees.length){$('inspector').innerHTML='<option value="">Geen medewerkers geladen</option>'}
}
function fillTypes(){
  $('type').innerHTML='<option value="">Kies een type</option>'+TYPES.map(t=>`<option>${t}</option>`).join('');
  $('filterType').innerHTML='<option value="">Alle typen</option>'+TYPES.map(t=>`<option>${t}</option>`).join('');
}
function resolveProject(id,fallback=''){return projectName(projects.find(p=>projectId(p)===String(id)))||fallback||id||'Onbekend project'}
function resolveEmployee(id,fallback=''){return employeeName(employees.find(e=>employeeId(e)===String(id)))||fallback||id||'Niet ingevuld'}
function typeLabel(v){return v.type==='Overig'&&v.otherType?`Overig – ${v.otherType}`:v.type}
function isLate(v){return v.status==='Gepland'&&v.date<todayISO()}
function priorityClass(p){return p==='Spoed'?'urgent':p==='Hoog'?'high':''}
function statusPill(v){if(v.status==='Uitgevoerd')return '<span class="pill done">Uitgevoerd</span>';if(v.status==='Vervallen')return '<span class="pill cancelled">Vervallen</span>';if(isLate(v))return '<span class="pill late">Achterstallig</span>';return '<span class="pill">Gepland</span>'}
function weekBounds(){const d=new Date();d.setHours(0,0,0,0);const day=(d.getDay()+6)%7;const monday=new Date(d);monday.setDate(d.getDate()-day);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);return [monday.toISOString().slice(0,10),sunday.toISOString().slice(0,10)]}
function sortVisits(arr){return [...arr].sort((a,b)=>((a.date||'')+(a.time||'99:99')).localeCompare((b.date||'')+(b.time||'99:99')))}

function renderStats(){
  const t=todayISO(),[ws,we]=weekBounds();
  $('statToday').textContent=visits.filter(v=>v.date===t&&v.status==='Gepland').length;
  $('statWeek').textContent=visits.filter(v=>v.date>=ws&&v.date<=we&&v.status==='Gepland').length;
  $('statLate').textContent=visits.filter(isLate).length;
  $('statDone').textContent=visits.filter(v=>v.status==='Uitgevoerd').length;
}
function visitCard(v){
  const project=resolveProject(v.projectId,v.projectName),inspector=resolveEmployee(v.inspectorId,v.inspectorName);
  const canStart=['DKS','Nacontrole'].includes(v.type)&&v.status==='Gepland';
  return `<article class="item">
    <div><h3>${esc(project)}</h3><div class="meta"><span>${fmtDate(v.date)}${v.time?' · '+esc(v.time):''}</span><span>•</span><span>${esc(typeLabel(v))}</span><span>•</span><span>${esc(inspector)}</span></div>
    <div class="meta" style="margin-top:8px">${statusPill(v)}<span class="pill ${priorityClass(v.priority)}">${esc(v.priority||'Normaal')}</span>${v.notes?`<span>${esc(v.notes)}</span>`:''}</div></div>
    <div class="actions">
      ${canStart?`<button class="btn success" onclick="startControl('${v.id}')">▶ Start controle</button>`:''}
      <button class="btn secondary" onclick="openVisit('${v.id}')">Openen</button>
    </div></article>`;
}
function renderUpcoming(){
  const items=sortVisits(visits.filter(v=>v.status==='Gepland')).slice(0,8);
  $('upcomingList').innerHTML=items.length?items.map(visitCard).join(''):'<div class="empty">Er staan nog geen geplande bezoeken.</div>';
}
function renderPlanning(){
  const q=$('filterSearch').value.trim().toLowerCase(),type=$('filterType').value,status=$('filterStatus').value,ins=$('filterInspector').value;
  let arr=visits.filter(v=>{
    const hay=[resolveProject(v.projectId,v.projectName),v.notes,v.otherType].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!type||v.type===type)&&(!status||v.status===status)&&(!ins||String(v.inspectorId)===ins)
  });
  arr=sortVisits(arr);
  $('planningList').innerHTML=arr.length?arr.map(visitCard).join(''):'<div class="empty">Geen bezoeken gevonden met deze filters.</div>';
}
function renderHistory(){
  const pid=$('historyProject').value;if(!pid){$('historyList').innerHTML='<div class="empty">Kies eerst een project.</div>';return}
  const arr=sortVisits(visits.filter(v=>String(v.projectId)===pid)).reverse();
  $('historyList').innerHTML=arr.length?arr.map(visitCard).join(''):'<div class="empty">Voor dit project is nog geen historie.</div>';
}
function renderAll(){renderStats();renderUpcoming();renderPlanning();renderHistory()}

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));if(id==='new'&&!$('visitId').value){resetForm()}window.scrollTo({top:0,behavior:'smooth'})}
function resetForm(){
  $('visitForm').reset();$('visitId').value='';$('formTitle').textContent='Nieuw projectbezoek';$('date').value=todayISO();$('priority').value='Normaal';$('status').value='Gepland';$('otherTypeWrap').classList.add('hide');$('otherType').required=false;
}
function editVisit(id){
  const v=visits.find(x=>x.id===id);if(!v)return;closeModal();showView('new');$('visitId').value=v.id;$('formTitle').textContent='Projectbezoek bewerken';$('project').value=String(v.projectId);$('inspector').value=String(v.inspectorId);$('type').value=v.type;$('otherType').value=v.otherType||'';$('date').value=v.date;$('time').value=v.time||'';$('priority').value=v.priority||'Normaal';$('status').value=v.status||'Gepland';$('notes').value=v.notes||'';toggleOtherType();
}
function deleteVisit(id){if(!confirm('Dit projectbezoek verwijderen?'))return;visits=visits.filter(v=>v.id!==id);closeModal();queueSync()}
function updateStatus(id,status){const v=visits.find(x=>x.id===id);if(!v)return;v.status=status;v.updatedAt=new Date().toISOString();if(status==='Uitgevoerd')v.completedAt=new Date().toISOString();closeModal();queueSync()}
function openVisit(id){
  const v=visits.find(x=>x.id===id);if(!v)return;const project=resolveProject(v.projectId,v.projectName),ins=resolveEmployee(v.inspectorId,v.inspectorName);
  const canStart=['DKS','Nacontrole'].includes(v.type)&&v.status==='Gepland';
  $('modalContent').innerHTML=`<div class="sectionbody" style="padding:0">
    <div class="formgrid"><div class="field"><label>Project</label><strong>${esc(project)}</strong></div><div class="field"><label>Controleur</label><strong>${esc(ins)}</strong></div><div class="field"><label>Type</label><strong>${esc(typeLabel(v))}</strong></div><div class="field"><label>Datum</label><strong>${fmtDate(v.date)}${v.time?' · '+esc(v.time):''}</strong></div><div class="field"><label>Prioriteit</label><strong>${esc(v.priority)}</strong></div><div class="field"><label>Status</label><strong>${statusPill(v)}</strong></div>${v.notes?`<div class="field span2"><label>Opmerking</label><div>${esc(v.notes)}</div></div>`:''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
      ${canStart?`<button class="btn success" onclick="startControl('${v.id}')">▶ Controle starten</button>`:''}
      ${v.status==='Gepland'?`<button class="btn primary" onclick="updateStatus('${v.id}','Uitgevoerd')">✓ Uitgevoerd</button><button class="btn ghost" onclick="updateStatus('${v.id}','Vervallen')">Vervallen</button>`:''}
      <button class="btn secondary" onclick="editVisit('${v.id}')">✏ Bewerken</button><button class="btn danger" onclick="deleteVisit('${v.id}')">🗑 Verwijderen</button>
    </div></div>`;
  $('detailsModal').classList.add('open');
}
function closeModal(){$('detailsModal').classList.remove('open')}
function startControl(id){
  const v=visits.find(x=>x.id===id);if(!v)return;
  const params=new URLSearchParams({visitId:v.id,projectId:v.projectId,project:resolveProject(v.projectId,v.projectName),type:v.type,date:v.date});
  window.location.href=`${CONFIG.CONTROL_PAGE}?${params.toString()}`;
}
function toggleOtherType(){const show=$('type').value==='Overig';$('otherTypeWrap').classList.toggle('hide',!show);$('otherType').required=show}

$('visitForm').addEventListener('submit',e=>{
  e.preventDefault();
  const pid=$('project').value,iid=$('inspector').value;
  if(!pid||!iid)return alert('Kies een project en controleur.');
  const id=$('visitId').value||uid(),existing=visits.find(v=>v.id===id);
  const item={
    id,projectId:pid,projectName:resolveProject(pid),inspectorId:iid,inspectorName:resolveEmployee(iid),
    type:$('type').value,otherType:$('otherType').value.trim(),date:$('date').value,time:$('time').value,
    priority:$('priority').value,status:$('status').value,notes:$('notes').value.trim(),
    createdAt:existing?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()
  };
  if(existing) visits=visits.map(v=>v.id===id?item:v); else visits.push(item);
  queueSync();resetForm();showView('planning');
});

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showView(t.dataset.view)));
['filterSearch','filterType','filterStatus','filterInspector'].forEach(id=>$(id).addEventListener('input',renderPlanning));
$('clearFilters').addEventListener('click',()=>{['filterSearch','filterType','filterStatus','filterInspector'].forEach(id=>$(id).value='');renderPlanning()});
$('historyProject').addEventListener('change',renderHistory);$('type').addEventListener('change',toggleOtherType);$('cancelEdit').addEventListener('click',()=>{resetForm();showView('planning')});

(async function init(){fillTypes();resetForm();loadLocal();renderAll();await loadReferenceData();renderAll();await loadVisits()})();
</script>
</body>
</html>
