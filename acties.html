<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acties & Meldingen</title>
<style>:root{--g:#95c11f;--d:#1d2732;--bg:#f3f5f7;--line:#dfe4e8;--muted:#65717c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--d)}header{background:var(--d);padding:18px;color:#fff}header div,main{max-width:1080px;margin:auto}.back{color:#fff;text-decoration:none;font-weight:800}h1{color:var(--g);margin:14px 0 0}main{padding:20px 14px 45px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.wide{grid-column:span 2}label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #cdd5db;border-radius:9px}textarea{min-height:80px}.buttons,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary,.tab{background:#e9edf0;color:var(--d)}.danger{background:#fee2e2;color:#991b1b}.tab.active{background:var(--d);color:#fff}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:14px 0}.item{background:#fff;border:1px solid var(--line);border-left:6px solid var(--g);border-radius:11px;padding:14px;margin:9px 0}.item.high{border-left-color:#dc2626}.item.normal{border-left-color:#f59e0b}.item.late{background:#fff7f7}.top{display:flex;justify-content:space-between;gap:10px}.title{font-size:17px;font-weight:900}.meta{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.45}.note{margin-top:9px;white-space:pre-wrap}.badge{background:#edf1f3;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:800;height:max-content}.empty{text-align:center;color:var(--muted);padding:25px}.edit{display:none;background:#edf8d1;padding:9px;border-radius:8px;font-weight:800}@media(max-width:650px){.grid,.filters{grid-template-columns:1fr}.wide{grid-column:auto}.top{display:block}.badge{display:inline-block;margin-top:8px}}</style></head>
<body><header><div><a class="back" href="index.html">← Terug naar Dashboard</a><h1>✅ Acties & Meldingen</h1></div></header><main>
<section class="card" id="form"><div class="edit" id="edit">Je bewerkt een bestaande actie.</div><h2 id="heading">Nieuwe actie of melding</h2><div class="grid">
<div class="wide"><label>Onderwerp *</label><input id="subject" placeholder="Bijv. klacht opvolgen"></div><div><label>Soort</label><select id="type"><option>Werkmelding</option><option>Afspraak</option><option>Deadline</option><option>Notitie</option><option>Overig</option></select></div><div><label>Deadline</label><input id="deadline" type="date"></div><div><label>Project</label><input id="project" placeholder="Optioneel"></div><div><label>Medewerker</label><input id="employee" placeholder="Optioneel"></div><div><label>Prioriteit</label><select id="priority"><option>Normaal</option><option>Hoog</option><option>Laag</option></select></div><div><label>Status</label><select id="status"><option>Open</option><option>Bezig</option><option>Afgerond</option></select></div><div class="wide"><label>Notitie</label><textarea id="notes" placeholder="Wat moet er gebeuren?"></textarea></div></div><div class="buttons"><button class="primary" id="save" onclick="saveItem()">Actie opslaan</button><button class="secondary" onclick="clearForm()">Velden leegmaken</button></div></section>
<section class="card"><h2>Openstaande zaken</h2><div class="tabs"><button class="tab active" onclick="view('all',this)">Alles</button><button class="tab" onclick="view('today',this)">Vandaag</button><button class="tab" onclick="view('week',this)">Deze week</button><button class="tab" onclick="view('later',this)">Later</button><button class="tab" onclick="view('done',this)">Afgerond</button></div><div class="filters"><input id="search" oninput="render()" placeholder="Zoeken"><select id="pf" onchange="render()"><option value="">Alle projecten</option></select><select id="ef" onchange="render()"><option value="">Alle medewerkers</option></select></div><b id="count"></b><div id="list"></div></section>
</main><script>
const KEY='eresde_acties_v1',$=x=>document.getElementById(x);let editing=null,tab='all';
const all=()=>{try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}},put=x=>{localStorage.setItem(KEY,JSON.stringify(x));render()},esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},id=()=>Date.now().toString(36)+Math.random().toString(16).slice(2);
function saveItem(){if(!subject.value.trim())return alert('Vul een onderwerp in.');let data=all(),old=data.find(x=>x.id===editing),x={id:editing||id(),subject:subject.value.trim(),type:type.value,deadline:deadline.value,project:project.value.trim(),employee:employee.value.trim(),priority:priority.value,status:status.value,notes:notes.value.trim(),created:old?.created||new Date().toISOString()};put(editing?data.map(v=>v.id===editing?x:v):[x,...data]);clearForm()}
function clearForm(){editing=null;['subject','deadline','project','employee','notes'].forEach(x=>$(x).value='');type.value='Werkmelding';priority.value='Normaal';status.value='Open';edit.style.display='none';heading.textContent='Nieuwe actie of melding';save.textContent='Actie opslaan'}
function editItem(i){let x=all().find(v=>v.id===i);if(!x)return;editing=i;['subject','type','deadline','project','employee','priority','status','notes'].forEach(k=>$(k).value=x[k]||'');edit.style.display='block';heading.textContent='Actie bewerken';save.textContent='Wijziging opslaan';form.scrollIntoView({behavior:'smooth'})}
function done(i){put(all().map(x=>x.id===i?{...x,status:'Afgerond'}:x))}function del(i){if(confirm('Deze actie verwijderen?'))put(all().filter(x=>x.id!==i))}function view(v,b){tab=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function fillFilters(data){let pv=pf.value,ev=ef.value,p=[...new Set(data.map(x=>x.project).filter(Boolean))].sort(),e=[...new Set(data.map(x=>x.employee).filter(Boolean))].sort();pf.innerHTML='<option value="">Alle projecten</option>'+p.map(x=>`<option>${esc(x)}</option>`).join('');ef.innerHTML='<option value="">Alle medewerkers</option>'+e.map(x=>`<option>${esc(x)}</option>`).join('');pf.value=pv;ef.value=ev}
function render(){let data=all();fillFilters(data);let d=date(),end=new Date();end.setDate(end.getDate()+((7-end.getDay())%7));let w=new Date(end-end.getTimezoneOffset()*60000).toISOString().slice(0,10),q=search.value.toLowerCase();data=data.filter(x=>{if(tab==='done')return x.status==='Afgerond';if(x.status==='Afgerond')return false;if(tab==='today')return x.deadline&&x.deadline<=d;if(tab==='week')return x.deadline&&x.deadline>=d&&x.deadline<=w;if(tab==='later')return !x.deadline||x.deadline>w;return true});if(q)data=data.filter(x=>[x.subject,x.project,x.employee,x.notes].join(' ').toLowerCase().includes(q));if(pf.value)data=data.filter(x=>x.project===pf.value);if(ef.value)data=data.filter(x=>x.employee===ef.value);data.sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));count.textContent=data.length+' '+(data.length===1?'zaak':'zaken');list.innerHTML=data.length?data.map(x=>`<div class="item ${x.priority==='Hoog'?'high':x.priority==='Normaal'?'normal':''} ${x.status!=='Afgerond'&&x.deadline&&x.deadline<d?'late':''}"><div class="top"><div><div class="title">${esc(x.subject)}</div><div class="meta">${esc(x.type)} · ${x.deadline?new Date(x.deadline+'T12:00').toLocaleDateString('nl-NL'):'Geen deadline'}${x.project?' · 📁 '+esc(x.project):''}${x.employee?' · 👤 '+esc(x.employee):''}</div></div><span class="badge">${esc(x.status)}</span></div>${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}<div class="buttons">${x.status!=='Afgerond'?`<button class="primary" onclick="done('${x.id}')">✓ Afronden</button>`:''}<button class="secondary" onclick="editItem('${x.id}')">Bewerken</button><button class="danger" onclick="del('${x.id}')">Verwijderen</button></div></div>`).join(''):'<div class="empty">Geen zaken gevonden.</div>'}render();if(new URLSearchParams(location.search).has('nieuw'))subject.focus();
</script></body></html>
